[project]
name = "aidev-lb"
version = "0.5.0"
description = "Run coding-agent harnesses of your choice on a small Terminal-Bench 2.1 subset: one HF Job per harness on your own HF account, results in results.json."
readme = "README.md"
requires-python = ">=3.12"
# The base install is what the laptop needs for `aidev-lb run` (a few MB). The `run` extra is what the
# HF Job installs to run trials.
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=1.33,<2",
]

[project.optional-dependencies]
run = [
    # The Harness Leaderboard's harness wiring, in-sandbox meter and HF Sandbox environment,
    # pinned to the deployed Space revision (public). It pins huggingface-hub 1.33.0 and,
    # with [worker], harbor[hf-sandbox] 0.24.0.
    "harness-leaderboard[worker] @ git+https://huggingface.co/spaces/joelniklaus/harness-leaderboard@3cf8a20805cbe6bccad1c34db2287aa76487df8e",
]

[project.scripts]
aidev-lb = "aidev_lb.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "aidev-lb[run]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aidev_lb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

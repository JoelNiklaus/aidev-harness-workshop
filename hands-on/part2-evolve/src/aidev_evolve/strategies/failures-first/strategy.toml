# Optimization strategy (edit the knobs below; `aidev-evolve strategy-init failures-first my-strategy` makes a copy).
# Fixed for everyone and refused here: model, time budget, splits, held-out set, seed, the shape of the run, credit cap.
name = "failures-first"
based_on = "failures-first"
description = "Only failed trajectories; tally the failure mechanisms first, then fix the most frequent one."
iterations = 4        # most iterations of `run --full` (1..6); the workshop run does one

[evidence]
traces = "failed"        # "failed": failed search trajectories only; "all": failed first, then passed
max_traces = 8         # how many trajectories the proposer gets (1..8)
history = "titles"       # earlier attempts in HISTORY.md: "none", "titles" (title + verdict), "full" (+ patch notes, fixed/broke)
diffs = false         # include each earlier attempt's diff in HISTORY.md

[proposer]
candidates = 1         # 1, or 2 proposals per iteration screened on validation (the better one goes on)
prompt_file = "proposer_prompt.md"
second_hint = ""      # extra instruction for the second proposal (candidates = 2)

[keep]
val_trials = 2         # validation trials per task for child and parent (1..3)
z = 1.5                # keep if the child wins by z paired standard errors (and at least one task) (0..3)
confirm = true         # re-measure a winner before it counts (always on with 2 candidates)

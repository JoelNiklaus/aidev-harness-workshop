[project]
name = "aidev-evolve"
version = "0.7.0"
description = "Fix a small coding-agent harness on Terminal-Bench 2.1: your coding agent finds and fixes its bugs, an HF Job scores each version on HF Sandboxes with GLM-5.3-Flash, and a local chart shows the score by version."
readme = "README.md"
requires-python = ">=3.12"
# The base install is what the laptop needs (Job submission, log reading, the chart).
# The `run` extra is what the HF Job installs to run trials with Harbor.
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=1.33,<2",
]

[project.optional-dependencies]
run = [
    # Same pin as the Part 1 runner (a test compares them): the Harness Leaderboard's HF Sandbox environment at the
    # public Space revision 3cf8a208 = hlb 0.1.11, which stops an agent's command when its time is up, before the
    # tests run (tests/test_agent_stop.py; up to 0.5.1 the pin was hlb 0.1.7, which did not).
    "harness-leaderboard[worker] @ git+https://huggingface.co/spaces/joelniklaus/harness-leaderboard@3cf8a20805cbe6bccad1c34db2287aa76487df8e",
]

[project.scripts]
aidev-evolve = "aidev_evolve.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "aidev-evolve[run]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aidev_evolve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real HF Jobs or router calls (opt-in: -m live)"]
addopts = "-m 'not live'"

[project]
name = "aidev-swarm-coordinator"
version = "0.1.0"
description = "Coordinator and live board for the AI Dev NYC Part 1 swarm evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "huggingface_hub>=1.33",
]

[project.scripts]
coordinator = "swarm_coordinator.cli:main"
swarm-loadtest = "swarm_coordinator.loadtest:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
